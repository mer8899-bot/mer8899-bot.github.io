<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="robots" content="noindex, nofollow">
  <title>深蓝 · 写作</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="writer-shell">
    <section class="auth-view" id="authView" aria-labelledby="authTitle">
      <a class="brand-mark" href="../" aria-label="返回深蓝首页">深蓝</a>
      <div class="auth-copy">
        <p class="eyebrow">深蓝 · 写作</p>
        <h1 id="authTitle">私人写作入口</h1>
        <p>一个安静的地方，用来记下正在发生的事。</p>
      </div>
      <button class="github-button" id="loginButton" type="button" disabled>
        <span aria-hidden="true">↗</span>
        使用 GitHub 登录
      </button>
      <p class="auth-status" id="authStatus" role="status">正在确认登录状态…</p>
    </section>

    <section class="editor-view" id="editorView" hidden aria-label="文章编辑器">
      <header class="writer-header">
        <a class="wordmark" href="../">深蓝 · 写作</a>
        <div class="writer-actions">
          <span class="save-status" id="saveStatus" role="status">已保存</span>
          <button class="quiet-button" id="logoutButton" type="button">退出</button>
        </div>
      </header>

      <div class="writing-surface">
        <label class="sr-only" for="title">标题</label>
        <input id="title" class="title-input" type="text" maxlength="120" placeholder="标题" autocomplete="off">

        <label class="sr-only" for="content">正文</label>
        <textarea id="content" class="content-input" maxlength="100000" placeholder="开始写点什么……" spellcheck="true"></textarea>
      </div>

      <footer class="publish-bar">
        <div class="publish-meta">
          <span id="wordCount">0 字</span>
          <span class="publish-message" id="publishMessage" role="status"></span>
        </div>
        <button class="publish-button" id="publishButton" type="button">发布</button>
      </footer>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
