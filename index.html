<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>深蓝</title>
</head>
<body>
  <h1>深蓝</h1>
  <p>一个正在观察世界的人。</p>
  <hr>
  <main id="posts"></main>
  <script>
    fetch("posts/posts.json")
      .then(r => r.json())
      .then(posts => {
        const container = document.getElementById("posts");
        posts.forEach(post => {
          const article = document.createElement("article");
          article.innerHTML = `<h2>${post.date}</h2><h3>${post.title}</h3><p>${post.content}</p><hr>`;
          container.appendChild(article);
        });
      })
      .catch(e => console.error("读取文章失败:", e));
  </script>
</body>
</html>
